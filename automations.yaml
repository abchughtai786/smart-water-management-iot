# ============================================================
# 7. UGWT PRIORITY LOW — REPEATING NOTIFICATION
# ============================================================

- id: "ugwt_priority_low_notify"
  alias: "UGWT Priority Low - Repeating Notification"

  description: >
    Sends a notification when the underground tank
    falls below 50% and repeats every 15 minutes
    while the condition remains active.

  trigger:
    - platform: numeric_state
      entity_id: sensor.groundwater_level_percent
      below: 50

    - platform: time_pattern
      minutes: "/15"

  condition:
    - condition: numeric_state
      entity_id: sensor.groundwater_level_percent
      below: 50

  action:
    - service: notify.send_message
      target:
        entity_id:
          - notify.example_phone_1
          - notify.example_phone_2

      data:
        title: "UGWT Priority Low"
        message: >
          Underground tank water level is
          {{ states('sensor.groundwater_level_percent') }}%.
          Water level is below 50%.

  mode: single


