# ============================================================
# 9. UGWT FULL — DEEP WELL PUMP CUTOFF
# ============================================================

- id: "deepwell_full_cutoff"
  alias: "UGWT Full - Deep Well Pump Cutoff"

  description: >
    Requests deep-well pump shutdown at the
    underground tank's 100% level.
    Includes pump activation and periodic checks.

  trigger:
    - platform: numeric_state
      entity_id: sensor.groundwater_level_percent
      above: 99
      for:
        seconds: 5

    - platform: state
      entity_id: switch.deep_well_pump
      to: "on"
      for:
        seconds: 5

    - platform: numeric_state
      entity_id: sensor.water_level_percent
      above: 94
      for:
        seconds: 5

    - platform: time_pattern
      minutes: "/1"

  condition:
    - condition: state
      entity_id: switch.deep_well_pump
      state: "on"

    - condition: numeric_state
      entity_id: sensor.groundwater_level_percent
      above: 99

  action:
    - service: switch.turn_off
      target:
        entity_id: switch.deep_well_pump

  mode: single


# ============================================================
# 10. CROSS-TANK PRIORITY FILLING
# ============================================================

- id: "ohwt_priority_fill_when_ugwt_full"
  alias: "OHWT Priority Fill - UGWT Full"

  description: >
    Requests priority overhead tank filling when
    the overhead tank is at or below 20%,
    the underground tank is at 100%,
    and the deep-well pump is running.

  trigger:
    - platform: numeric_state
      entity_id: sensor.water_level_percent
      below: 21
      for:
        seconds: 5

    - platform: numeric_state
      entity_id: sensor.groundwater_level_percent
      above: 99
      for:
        seconds: 5

    - platform: state
      entity_id: switch.deep_well_pump
      to: "on"
      for:
        seconds: 5

  condition:
    - condition: numeric_state
      entity_id: sensor.water_level_percent
      below: 21

    - condition: numeric_state
      entity_id: sensor.groundwater_level_percent
      above: 99

    - condition: state
      entity_id: switch.deep_well_pump
      state: "on"

    - condition: state
      entity_id: switch.example_ohwt_pump
      state: "off"

  action:
    - service: switch.turn_on
      target:
        entity_id: switch.example_ohwt_pump

  mode: single
