# ============================================================
# SMART WATER MANAGEMENT - HOME ASSISTANT AUTOMATIONS
# ============================================================
#
# OHWT = Overhead Water Tank     UGWT = Underground Water Tank
#
# Pumps:
#   switch.ohwt_pump       fills the OHWT from the UGWT
#   switch.deep_well_pump  fills the UGWT from the deep well
#
# Design rules:
#   - a pump is only started when every reading it depends on
#     is available and safe
#   - safety rules (failsafe, dry-run, max runtime) always
#     stop a pump; they never start one
#   - "for:" holds filter out float-switch bounce
#
# These automations are software controls. A real installation
# also needs hardware protection (dry-run relay, overload
# protection, float-switch interlock) and testing.
# ============================================================


# ============================================================
# PUMP CONTROL
# ============================================================

- id: ohwt_low_start
  alias: "OHWT Low - Start Pump"
  description: >-
    Starts the OHWT pump when the overhead tank stays at or below 25%
    for two minutes, but only if the underground tank has water and
    both tank controllers are online.
  triggers:
    - trigger: numeric_state
      entity_id: sensor.ohwt_level
      below: 26
      for:
        minutes: 2
  conditions:
    - condition: state
      entity_id: switch.ohwt_pump
      state: "off"
    - condition: numeric_state
      entity_id: sensor.ugwt_level
      above: 24
    - condition: state
      entity_id:
        - binary_sensor.ohwt_online
        - binary_sensor.ugwt_online
      state: "on"
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.ohwt_pump
  mode: single

- id: ohwt_full_cutoff
  alias: "OHWT Full - Pump Cutoff"
  description: >-
    Stops the OHWT pump at 95%. Also re-checks every minute, so a
    missed event cannot leave the pump running.
  triggers:
    - trigger: numeric_state
      entity_id: sensor.ohwt_level
      above: 94
      for:
        seconds: 5
    - trigger: state
      entity_id: switch.ohwt_pump
      to: "on"
      for:
        seconds: 5
    - trigger: time_pattern
      minutes: "/1"
  conditions:
    - condition: state
      entity_id: switch.ohwt_pump
      state: "on"
    - condition: numeric_state
      entity_id: sensor.ohwt_level
      above: 94
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.ohwt_pump
  mode: single

- id: ohwt_peak_hours_cutoff
  alias: "OHWT Peak Hours - Partial Fill Cutoff"
  description: >-
    Between 18:00 and 22:00 the OHWT pump stops at 50%. Exception:
    it may keep filling while the UGWT is full AND the deep-well pump
    is running, so the deep-well water has somewhere to go. Fires at
    18:00, when the level reaches 50%, and when the pump is switched
    on during peak hours.
  triggers:
    - trigger: time
      at: "18:00:00"
    - trigger: numeric_state
      entity_id: sensor.ohwt_level
      above: 49
      for:
        minutes: 2
    - trigger: state
      entity_id: switch.ohwt_pump
      to: "on"
      for:
        seconds: 30
  conditions:
    - condition: time
      after: "18:00:00"
      before: "22:00:00"
    - condition: state
      entity_id: switch.ohwt_pump
      state: "on"
    - condition: numeric_state
      entity_id: sensor.ohwt_level
      above: 49
    # "not" passes only when none of its conditions are true, so the
    # two exception conditions are combined with "and" inside it.
    - condition: not
      conditions:
        - condition: and
          conditions:
            - condition: numeric_state
              entity_id: sensor.ugwt_level
              above: 99
            - condition: state
              entity_id: switch.deep_well_pump
              state: "on"
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.ohwt_pump
  mode: single

- id: ohwt_priority_fill_when_ugwt_full
  alias: "OHWT Priority Fill - UGWT Full"
  description: >-
    Starts the OHWT pump when the overhead tank is at or below 20%,
    the underground tank is full and the deep-well pump is running.
  triggers:
    - trigger: numeric_state
      entity_id: sensor.ohwt_level
      below: 21
      for:
        seconds: 5
    - trigger: numeric_state
      entity_id: sensor.ugwt_level
      above: 99
      for:
        seconds: 5
    - trigger: state
      entity_id: switch.deep_well_pump
      to: "on"
      for:
        seconds: 5
  conditions:
    - condition: numeric_state
      entity_id: sensor.ohwt_level
      below: 21
    - condition: numeric_state
      entity_id: sensor.ugwt_level
      above: 99
    - condition: state
      entity_id: switch.deep_well_pump
      state: "on"
    - condition: state
      entity_id: switch.ohwt_pump
      state: "off"
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.ohwt_pump
  mode: single

- id: deep_well_full_cutoff
  alias: "UGWT Full - Deep-Well Pump Cutoff"
  description: >-
    Stops the deep-well pump when the underground tank is full, with a
    re-check every minute.
  triggers:
    - trigger: numeric_state
      entity_id: sensor.ugwt_level
      above: 99
      for:
        seconds: 5
    - trigger: state
      entity_id: switch.deep_well_pump
      to: "on"
      for:
        seconds: 5
    - trigger: time_pattern
      minutes: "/1"
  conditions:
    - condition: state
      entity_id: switch.deep_well_pump
      state: "on"
    - condition: numeric_state
      entity_id: sensor.ugwt_level
      above: 99
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.deep_well_pump
  mode: single


# ============================================================
# SAFETY - these rules only ever STOP pumps
# ============================================================

- id: safety_ohwt_pump_dry_run
  alias: "Safety - OHWT Pump Dry-Run Protection"
  description: >-
    Stops the OHWT pump when the underground tank it draws from is
    empty (below the lowest float switch), so the pump never runs dry.
  triggers:
    - trigger: numeric_state
      entity_id: sensor.ugwt_level
      below: 25
      for:
        seconds: 30
    - trigger: state
      entity_id: switch.ohwt_pump
      to: "on"
      for:
        seconds: 30
  conditions:
    - condition: state
      entity_id: switch.ohwt_pump
      state: "on"
    - condition: numeric_state
      entity_id: sensor.ugwt_level
      below: 25
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.ohwt_pump
    - action: notify.family_phones
      data:
        title: "OHWT pump stopped"
        message: "Underground tank is empty - pump stopped to prevent dry running."
  mode: single

- id: safety_controller_offline
  alias: "Safety - Stop Pumps When a Tank Controller Goes Offline"
  description: >-
    Without level readings the full-tank cutoffs cannot work, so any
    running pump is stopped when a tank controller has been offline
    (or its level unavailable) for one minute.
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.ohwt_online
        - binary_sensor.ugwt_online
      to:
        - "off"
        - "unavailable"
      for:
        minutes: 1
    - trigger: state
      entity_id:
        - sensor.ohwt_level
        - sensor.ugwt_level
      to: "unavailable"
      for:
        minutes: 1
  conditions:
    - condition: or
      conditions:
        - condition: state
          entity_id: switch.ohwt_pump
          state: "on"
        - condition: state
          entity_id: switch.deep_well_pump
          state: "on"
  actions:
    - action: switch.turn_off
      target:
        entity_id:
          - switch.ohwt_pump
          - switch.deep_well_pump
    - action: notify.family_phones
      data:
        title: "Pumps stopped - controller offline"
        message: >-
          {{ trigger.to_state.name }} has been unavailable for a minute,
          so the pumps were stopped. Check the tank controller.
  mode: single

- id: safety_max_runtime
  alias: "Safety - Maximum Pump Runtime"
  description: >-
    Backstop for a stuck float switch: stops a pump that has run far
    longer than a normal fill (45 min OHWT, 120 min deep well).
  triggers:
    - trigger: state
      entity_id: switch.ohwt_pump
      to: "on"
      for:
        minutes: 45
    - trigger: state
      entity_id: switch.deep_well_pump
      to: "on"
      for:
        minutes: 120
  actions:
    - action: switch.turn_off
      target:
        entity_id: "{{ trigger.entity_id }}"
    - action: notify.family_phones
      data:
        title: "Pump stopped - maximum runtime"
        message: >-
          {{ trigger.to_state.name }} ran longer than expected and was
          stopped. Check the float switches.
  mode: queued


# ============================================================
# NOTIFICATIONS
# ============================================================

- id: ohwt_low_notify
  alias: "OHWT Low - Notify"
  triggers:
    - trigger: numeric_state
      entity_id: sensor.ohwt_level
      below: 26
      for:
        minutes: 2
  actions:
    - action: notify.family_phones
      data:
        title: "OHWT low"
        message: "Overhead tank is at {{ states('sensor.ohwt_level') }}%."
  mode: single

- id: ohwt_high_notify
  alias: "OHWT High - Notify"
  triggers:
    - trigger: numeric_state
      entity_id: sensor.ohwt_level
      above: 94
      for:
        minutes: 2
  actions:
    - action: notify.family_phones
      data:
        title: "OHWT high"
        message: "Overhead tank is at {{ states('sensor.ohwt_level') }}%."
  mode: single

- id: ugwt_low_notify
  alias: "UGWT Low - Notify"
  triggers:
    - trigger: numeric_state
      entity_id: sensor.ugwt_level
      below: 26
      for:
        minutes: 2
  actions:
    - action: notify.family_phones
      data:
        title: "UGWT low"
        message: "Underground tank is at {{ states('sensor.ugwt_level') }}%."
  mode: single

- id: ugwt_priority_low_notify
  alias: "UGWT Below 50% - Repeating Notification"
  description: >-
    Notifies when the underground tank falls below 50% and repeats
    every 15 minutes while it stays there.
  triggers:
    - trigger: numeric_state
      entity_id: sensor.ugwt_level
      below: 50
    - trigger: time_pattern
      minutes: "/15"
  conditions:
    - condition: numeric_state
      entity_id: sensor.ugwt_level
      below: 50
  actions:
    - action: notify.family_phones
      data:
        title: "UGWT below 50%"
        message: "Underground tank is at {{ states('sensor.ugwt_level') }}%."
  mode: single

- id: ugwt_high_notify
  alias: "UGWT High - Notify"
  triggers:
    - trigger: numeric_state
      entity_id: sensor.ugwt_level
      above: 94
      for:
        minutes: 2
  actions:
    - action: notify.family_phones
      data:
        title: "UGWT high"
        message: "Underground tank is at {{ states('sensor.ugwt_level') }}%."
  mode: single
